# Portable Python environment; select the PyTorch CPU/CUDA wheel afterwards.
name: dqn-starter
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - gymnasium[classic-control]==1.4.0
      - numpy==2.5.4
      - pygame-ce==2.5.8
      - pillow==13.0.0
      - imageio==2.38.1
      - imageio-ffmpeg==0.6.0
      - matplotlib==3.11.2
